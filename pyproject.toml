[project]
name = "014-disinfo-tracker"
version = "0.1.0"
description = "SEIZ disinformation trajectory simulator with C++17/Eigen3/pybind11 core, FastAPI, Celery, PostgreSQL, and Streamlit analyst workbench."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "celery>=5.7.0",
    "fastapi>=0.163.1",
    "greenlet>=3.5.6",
    "httpx>=0.28.1",
    "influxdb-client>=1.50.0",
    "numpy>=2.5.5",
    "plotly>=7.1.0",
    "prometheus-client>=0.26.0",
    "psycopg2-binary>=2.9.13",
    "pybind11>=3.1.0",
    "pydantic>=2.14.3",
    "redis>=8.1.0",
    "scipy>=1.18.1",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.1.9",
    "streamlit>=1.67.0",
    "structlog>=26.1.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = [
    "scipy.*",
    "plotly.*",
    "src.cpp_core.*",
    "slowapi",
    "slowapi.*",
    "limits.*",
    "celery",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "influxdb_client",
    "influxdb_client.*",
]
ignore_missing_imports = true
follow_imports = "skip"
